# xatlas for iPhone and iPad. Generate the Xcode project with `xcodegen` (see README.md).
name: Xatlas
options:
  bundleIdPrefix: com.xatlas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Xatlas:
    type: application
    platform: iOS
    sources:
      - path: Xatlas
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: xatlas
        PRODUCT_BUNDLE_IDENTIFIER: com.xatlas.ios
        INFOPLIST_FILE: Xatlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  XatlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XatlasTests
    dependencies:
      - target: Xatlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xatlas.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product name is lowercase "xatlas", unlike its target name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/xatlas.app/xatlas
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Xatlas:
    build:
      targets:
        Xatlas: all
        XatlasTests: [test]
    test:
      targets:
        - XatlasTests
